spring.application.name=transaction-authorizer

# Logging pattern with traceId from MDC
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId:-no-trace}] %-5level %logger{36} - %msg%n

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# Flyway migration configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# AWS SQS (Localstack) configuration
aws.sqs.queue-url=${AWS_SQS_QUEUE_URL}
aws.sqs.endpoint=${AWS_SQS_ENDPOINT}
aws.region=${AWS_REGION:sa-east-1}

# Resilience4j Retry (exponential backoff + jitter)
resilience4j.retry.instances.sqsOperations.max-attempts=4
resilience4j.retry.instances.sqsOperations.wait-duration=300ms
resilience4j.retry.instances.sqsOperations.enable-exponential-backoff=true
resilience4j.retry.instances.sqsOperations.exponential-backoff-multiplier=2.0
resilience4j.retry.instances.sqsOperations.enable-randomized-wait=true
resilience4j.retry.instances.sqsOperations.randomized-wait-factor=0.9

resilience4j.retry.instances.postgresRead.max-attempts=3
resilience4j.retry.instances.postgresRead.wait-duration=150ms
resilience4j.retry.instances.postgresRead.enable-exponential-backoff=true
resilience4j.retry.instances.postgresRead.exponential-backoff-multiplier=2.0
resilience4j.retry.instances.postgresRead.enable-randomized-wait=true
resilience4j.retry.instances.postgresRead.randomized-wait-factor=0.9

resilience4j.retry.instances.postgresWrite.max-attempts=2
resilience4j.retry.instances.postgresWrite.wait-duration=120ms
resilience4j.retry.instances.postgresWrite.enable-exponential-backoff=true
resilience4j.retry.instances.postgresWrite.exponential-backoff-multiplier=2.0
resilience4j.retry.instances.postgresWrite.enable-randomized-wait=true
resilience4j.retry.instances.postgresWrite.randomized-wait-factor=0.9
resilience4j.retry.instances.postgresWrite.ignore-exceptions=org.springframework.dao.DuplicateKeyException,org.springframework.dao.DataIntegrityViolationException,com.itau.transaction_authorizer.domain.exception.DomainException

# Resilience4j CircuitBreaker
resilience4j.circuitbreaker.instances.sqsOperations.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.sqsOperations.sliding-window-size=20
resilience4j.circuitbreaker.instances.sqsOperations.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.sqsOperations.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.sqsOperations.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.sqsOperations.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.postgresDb.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.postgresDb.sliding-window-size=30
resilience4j.circuitbreaker.instances.postgresDb.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.postgresDb.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.postgresDb.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.postgresDb.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.postgresDb.ignore-exceptions=com.itau.transaction_authorizer.domain.exception.DomainException
